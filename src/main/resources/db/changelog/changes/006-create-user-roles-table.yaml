databaseChangeLog:
  - changeSet:
      id: 006-1
      author: i.boldycheva
      changes:
        # Создаем таблицу ролей
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    primaryKey: true

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            constraintName: fk_user_roles_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        # Создаем предустановленных пользователей с защитой от дубликатов
        # Администратор (пароль 111)
        - sql:
            sql: >
              INSERT INTO users (user_name, email, password, created_at)
              SELECT 'admin', 'admin@budgetapp.com', '$2a$10$vzlf/HAkeWSDmHG6YFNJ8uCV/9rvWo/DAQh0V3J0D/MdEQL81Q5e6', CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE user_name = 'admin')

        # Пользователь 1 (пароль 222)
        - sql:
            sql: >
              INSERT INTO users (user_name, email, password, created_at)
              SELECT 'user1', 'user1@budgetapp.com', '$2a$10$ojpyudn3vFpLpqbe1fmoUOJflvVICjM2dZaqDsNOcSWhZ4fvikEPa', CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE user_name = 'user1')

        # Пользователь 2 (пароль 333)
        - sql:
            sql: >
              INSERT INTO users (user_name, email, password, created_at)
              SELECT 'user2', 'user2@budgetapp.com', '$2a$10$V5Rc8eJ7MflcdV/ZnDkjwuhhTODet2G4uRUjDesUf98JJhq6N.Yjm', CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE user_name = 'user2')

        # Добавляем роли для пользователей с защитой от дубликатов
        # Администратор (имеет обе роли) - ВАЖНО: сначала ADMIN
        - sql:
            sql: >
              INSERT INTO user_roles (user_id, role)
              SELECT 1, 'ADMIN'
              WHERE NOT EXISTS (SELECT 1 FROM user_roles WHERE user_id = 1 AND role = 'ADMIN')

        - sql:
            sql: >
              INSERT INTO user_roles (user_id, role)
              SELECT 1, 'USER'
              WHERE NOT EXISTS (SELECT 1 FROM user_roles WHERE user_id = 1 AND role = 'USER')

        # Обычные пользователи (только USER)
        - sql:
            sql: >
              INSERT INTO user_roles (user_id, role)
              SELECT 2, 'USER'
              WHERE NOT EXISTS (SELECT 1 FROM user_roles WHERE user_id = 2 AND role = 'USER')

        - sql:
            sql: >
              INSERT INTO user_roles (user_id, role)
              SELECT 3, 'USER'
              WHERE NOT EXISTS (SELECT 1 FROM user_roles WHERE user_id = 3 AND role = 'USER')
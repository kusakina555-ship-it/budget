databaseChangeLog:
  - changeSet:
      id: 006-1
      author: your_name
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    primaryKey: true

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            constraintName: fk_user_roles_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - insert:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  value: "1"  # ID существующего пользователя
              - column:
                  name: role
                  value: "USER"
databaseChangeLog:
  - changeSet:
      id: 004-1
      author: your_name
      changes:
        - createTable:
            tableName: subcategories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addColumn:
            tableName: transactions
            columns:
              - column:
                  name: subcategory_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: subcategories
            baseColumnNames: category_id
            constraintName: fk_subcategories_category_id
            referencedTableName: categories
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: transactions
            baseColumnNames: subcategory_id
            constraintName: fk_transactions_subcategory_id
            referencedTableName: subcategories
            referencedColumnNames: id
            onDelete: SET NULL
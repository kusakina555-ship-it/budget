databaseChangeLog:
  - changeSet:
      id: create-table-categories-002
      author: i.boldycheva
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: category_type
                  type: varchar(10)
                  constraints:
                    nullable: false

              - column:
                  name: parent_id
                  type: bigint
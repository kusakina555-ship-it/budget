databaseChangeLog:
  - changeSet:
      id: 008-create-telegram-users-table
      author: i.boldycheva
      changes:
        - createTable:
            tableName: telegram_users
            remarks: Таблица для хранения данных о подключении Telegram бота
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_telegram_users
                  remarks: Первичный ключ
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                  remarks: ID пользователя из таблицы users
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    unique: true
                    uniqueConstraintName: uk_telegram_users_chat_id
                  remarks: ID чата в Telegram
              - column:
                  name: telegram_username
                  type: VARCHAR(255)
                  remarks: Имя пользователя в Telegram
              - column:
                  name: auth_code
                  type: VARCHAR(10)
                  remarks: Код авторизации (8 символов)
              - column:
                  name: auth_code_expiry
                  type: TIMESTAMP
                  remarks: Срок действия кода авторизации
              - column:
                  name: is_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  remarks: Флаг подтверждения авторизации
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Дата создания записи
              - column:
                  name: verified_at
                  type: TIMESTAMP
                  remarks: Дата подтверждения авторизации

  - changeSet:
      id: 008-add-telegram-foreign-key
      author: i.boldycheva
      changes:
        - addForeignKeyConstraint:
            baseTableName: telegram_users
            baseColumnNames: user_id
            constraintName: fk_telegram_users_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            onUpdate: RESTRICT

  - changeSet:
      id: 008-add-telegram-indexes
      author: i.boldycheva
      changes:
        - createIndex:
            indexName: idx_telegram_users_user_id
            tableName: telegram_users
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_telegram_users_chat_id
            tableName: telegram_users
            columns:
              - column:
                  name: chat_id
        - createIndex:
            indexName: idx_telegram_users_auth_code
            tableName: telegram_users
            columns:
              - column:
                  name: auth_code
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Все операции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .transaction-type-badge {
            font-size: 0.8em;
        }
        .amount-income {
            color: #28a745;
            font-weight: bold;
        }
        .amount-expense {
            color: #dc3545;
            font-weight: bold;
        }
        .amount-transfer {
            color: #17a2b8;
            font-weight: bold;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-wallet me-2"></i> Семейный бюджет
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">
                <i class="fas fa-tachometer-alt me-2"></i>Дашборд
            </a>
            <a class="nav-link" href="/transactions/new">
                <i class="fas fa-plus-circle me-2"></i>Новая операция
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            <i class="fas fa-history me-2"></i>Все операции
        </h1>
        <a href="/transactions/new" class="btn btn-primary">
            <i class="fas fa-plus-circle me-2"></i>Добавить операцию
        </a>
    </div>

    <!-- Сообщения -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Таблица операций -->
    <div class="card">
        <div class="card-body">
            <div th:if="${transactions.empty}" class="text-center text-muted py-5">
                <i class="fas fa-receipt fa-4x mb-3"></i>
                <h4>Пока нет операций</h4>
                <p>Добавьте первую операцию</p>
                <a href="/transactions/new" class="btn btn-primary">
                    <i class="fas fa-plus-circle me-2"></i>Добавить операцию
                </a>
            </div>

            <div th:unless="${transactions.empty}" class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Категория</th>
                        <th>Тип</th>
                        <th>Сумма</th>
                        <th>Комментарий</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${#temporals.format(transaction.transactionDate, 'dd.MM.yyyy HH:mm')}"></td>
                        <td th:text="${transaction.category.name}"></td>
                        <td>
                                <span th:switch="${transaction.transactionType}">
                                    <span th:case="INCOME" class="badge bg-success transaction-type-badge">Доход</span>
                                    <span th:case="EXPENSE" class="badge bg-danger transaction-type-badge">Расход</span>
                                    <span th:case="TRANSFER" class="badge bg-info transaction-type-badge">Перевод</span>
                                </span>
                        </td>
                        <td>
                                <span th:switch="${transaction.transactionType}">
                                    <span th:case="INCOME" class="amount-income">
                                        +<span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span> ₽
                                    </span>
                                    <span th:case="EXPENSE" class="amount-expense">
                                        -<span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span> ₽
                                    </span>
                                    <span th:case="TRANSFER" class="amount-transfer">
                                        <span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span> ₽
                                    </span>
                                </span>
                        </td>
                        <td>
                            <small th:text="${transaction.comment ?: 'Без комментария'}"
                                   class="text-muted"></small>
                        </td>
                        <td>
                            <a th:href="@{/transactions/{id}(id=${transaction.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-eye"></i>
                            </a>
                            <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Удалить эту операцию?')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Все операции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .transaction-type-badge {
            font-size: 0.8em;
        }
        .amount-income {
            color: #28a745;
            font-weight: bold;
        }
        .amount-expense {
            color: #dc3545;
            font-weight: bold;
        }
        .amount-transfer {
            color: #17a2b8;
            font-weight: bold;
        }
        .transaction-item:hover {
            background-color: rgba(0,0,0,0.02);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-wallet me-2"></i> Семейный бюджет
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">
                <i class="fas fa-tachometer-alt me-2"></i>Дашборд
            </a>
            <a class="nav-link" href="/transactions/new">
                <i class="fas fa-plus-circle me-2"></i>Новая операция
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            <i class="fas fa-history me-2"></i>Все операции
        </h1>
        <a href="/transactions/new" class="btn btn-primary">
            <i class="fas fa-plus-circle me-2"></i>Добавить операцию
        </a>
    </div>

    <!-- Сообщения -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Таблица операций -->
    <div class="card">
        <div class="card-body">
            <div th:if="${transactions.empty}" class="text-center text-muted py-5">
                <i class="fas fa-receipt fa-4x mb-3"></i>
                <h4>Пока нет операций</h4>
                <p>Добавьте первую операцию</p>
                <a href="/transactions/new" class="btn btn-primary">
                    <i class="fas fa-plus-circle me-2"></i>Добавить операцию
                </a>
            </div>

            <div th:unless="${transactions.empty}" class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Категория</th>
                        <th>Тип</th>
                        <th>Сумма</th>
                        <th>Валюта</th>
                        <th>Комментарий</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="transaction : ${transactions}" class="transaction-item">
                        <td th:text="${#temporals.format(transaction.transactionDate, 'dd.MM.yyyy HH:mm')}"></td>
                        <td>
                            <strong th:text="${transaction.categoryName ?: 'Без категории'}"></strong>
                        </td>
                        <td>
                            <!-- Используем switch для типа транзакции -->
                            <span th:switch="${transaction.transactionType}">
                                <span th:case="${T(ru.boldycheva.budget.entity.TransactionType).INCOME}"
                                      class="badge bg-success transaction-type-badge">
                                    <i class="fas fa-arrow-up me-1"></i>Доход
                                </span>
                                <span th:case="${T(ru.boldycheva.budget.entity.TransactionType).EXPENSE}"
                                      class="badge bg-danger transaction-type-badge">
                                    <i class="fas fa-arrow-down me-1"></i>Расход
                                </span>
                                <span th:case="${T(ru.boldycheva.budget.entity.TransactionType).TRANSFER}"
                                      class="badge bg-info transaction-type-badge">
                                    <i class="fas fa-exchange-alt me-1"></i>Перевод
                                </span>
                            </span>
                        </td>
                        <td>
                            <!-- Используем switch для отображения суммы с нужным знаком -->
                            <span th:switch="${transaction.transactionType}">
                                <span th:case="${T(ru.boldycheva.budget.entity.TransactionType).INCOME}"
                                      class="amount-income">
                                    <i class="fas fa-plus-circle me-1"></i>
                                    <span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span>
                                </span>
                                <span th:case="${T(ru.boldycheva.budget.entity.TransactionType).EXPENSE}"
                                      class="amount-expense">
                                    <i class="fas fa-minus-circle me-1"></i>
                                    <span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span>
                                </span>
                                <span th:case="${T(ru.boldycheva.budget.entity.TransactionType).TRANSFER}"
                                      class="amount-transfer">
                                    <i class="fas fa-exchange-alt me-1"></i>
                                    <span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span>
                                </span>
                            </span>
                        </td>
                        <td>
                            <span class="badge bg-secondary">
                                <span th:text="${transaction.currency ?: 'RUB'}"></span>
                            </span>
                        </td>
                        <td>
                            <small th:text="${transaction.comment ?: 'Без комментария'}"
                                   class="text-muted d-block"
                                   style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></small>
                        </td>
                        <td>
                            <div class="btn-group" role="group">
                                <a th:href="@{/transactions/{id}(id=${transaction.id})}"
                                   class="btn btn-sm btn-outline-primary"
                                   title="Просмотр">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Удалить эту операцию?')"
                                            title="Удалить">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Сводная информация -->
            <div th:unless="${transactions.empty}" class="mt-3 pt-3 border-top">
                <div class="row">
                    <div class="col-md-4">
                        <small class="text-muted">
                            <i class="fas fa-list me-1"></i>
                            Всего операций: <strong th:text="${transactions.size()}"></strong>
                        </small>
                    </div>
                    <div class="col-md-8 text-end">
                        <a href="/transactions/new" class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-plus-circle me-1"></i>Добавить еще операцию
                        </a>
                        <a href="/dashboard" class="btn btn-sm btn-outline-secondary ms-2">
                            <i class="fas fa-arrow-left me-1"></i>Назад к дашборду
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

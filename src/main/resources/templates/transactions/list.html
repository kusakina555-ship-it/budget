<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все транзакции</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .transaction-list {
            margin-top: 20px;
        }

        .transaction-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-item:hover {
            background-color: #f9f9f9;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-date {
            color: #666;
            font-size: 14px;
        }

        .transaction-description {
            margin: 5px 0;
            font-size: 16px;
        }

        .transaction-amount {
            font-weight: bold;
            font-size: 18px;
            text-align: right;
            min-width: 120px;
        }

        .income {
            color: #4CAF50;
        }

        .expense {
            color: #f44336;
        }

        .transfer {
            color: #2196F3;
        }

        .transaction-comment {
            color: #666;
            font-style: italic;
            margin-top: 5px;
            font-size: 14px;
        }

        .actions {
            margin-left: 20px;
        }

        .btn-delete {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: #d32f2f;
        }

        .empty-message {
            text-align: center;
            color: #666;
            padding: 40px;
            font-size: 18px;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-new {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-new:hover {
            background-color: #45a049;
        }

        /* Стиль для связанных транзакций */
        .linked-transaction {
            background-color: #f0f8ff;
            border-left: 4px solid #2196F3;
            margin-left: 20px;
        }

        .linked-badge {
            background-color: #2196F3;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        /* Стиль для форматированного описания транзакции */
        .transaction-summary {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .transaction-details {
            color: #555;
            font-size: 14px;
        }

        /* Стили для типа транзакции в списке */
        .transaction-item.income {
            border-left: 4px solid #4CAF50;
        }

        .transaction-item.expense {
            border-left: 4px solid #f44336;
        }

        .transaction-item.transfer {
            border-left: 4px solid #2196F3;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-actions">
        <h1>📊 Все транзакции</h1>
        <a href="/transactions/new" class="btn-new">➕ Новая транзакция</a>
    </div>

    <!-- Сообщения об ошибках/успехе -->
    <div th:if="${successMessage}" style="color: #4CAF50; padding: 10px; background: #f0fff0; border-radius: 4px; margin-bottom: 20px;">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" style="color: #f44336; padding: 10px; background: #fff0f0; border-radius: 4px; margin-bottom: 20px;">
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="transaction-list">
        <div th:if="${transactions.empty}" class="empty-message">
            📭 Нет транзакций. <a href="/transactions/new">Создайте первую транзакцию</a>
        </div>

        <div th:each="transaction : ${transactions}"
             th:class="'transaction-item' +
                       (${transaction.relatedTransactionId != null} ? ' linked-transaction' : '') +
                       (${transaction.transactionType.name() == 'INCOME'} ? ' income' :
                        (${transaction.transactionType.name() == 'EXPENSE'} ? ' expense' : ' transfer'))">

            <div class="transaction-info">
                <div class="transaction-date">
                    📅 <span th:text="${#temporals.format(transaction.transactionDate, 'dd.MM.yyyy HH:mm')}"></span>
                    <span th:if="${transaction.relatedTransactionId != null}" class="linked-badge">↔️ связанная</span>
                </div>

                <div class="transaction-summary">
                    <!-- Используем отдельные проверки через th:if -->
                    <span th:if="${transaction.transactionType.name() == 'INCOME'}">
                        💰 Доход: <span th:text="${transaction.categoryName}"></span>
                        (счет: <span th:text="${transaction.accountName}"></span>)
                    </span>
                    <span th:if="${transaction.transactionType.name() == 'EXPENSE'}">
                        💸 Расход: <span th:text="${transaction.categoryName}"></span>
                        (счет: <span th:text="${transaction.accountName}"></span>)
                    </span>
                    <span th:if="${transaction.transactionType.name() == 'TRANSFER'}">
                        <span th:if="${transaction.amount < 0}">
                            ➡️ Перевод со счета: <span th:text="${transaction.accountName}"></span>
                            на счет: <span th:text="${transaction.counterpartyAccountName}"></span>
                        </span>
                        <span th:if="${transaction.amount >= 0}">
                            ⬅️ Перевод на счет: <span th:text="${transaction.accountName}"></span>
                            от счета: <span th:text="${transaction.counterpartyAccountName}"></span>
                        </span>
                    </span>
                </div>

                <div class="transaction-details" th:if="${transaction.counterpartyAccountName} and ${transaction.transactionType.name() != 'TRANSFER'}">
                    Контрагент: <span th:text="${transaction.counterpartyAccountName}"></span>
                </div>

                <div th:if="${transaction.comment}" class="transaction-comment">
                    💬 <span th:text="${transaction.comment}"></span>
                </div>
            </div>

            <div class="transaction-amount">
                <!-- Определяем класс CSS через th:class -->
                <span th:class="${transaction.transactionType.name() == 'INCOME'} ? 'income' :
                               (${transaction.transactionType.name() == 'EXPENSE'} ? 'expense' : 'transfer')">
                    <span th:if="${transaction.transactionType.name() == 'INCOME'}">+</span>
                    <span th:if="${transaction.transactionType.name() == 'EXPENSE'}">-</span>
                    <span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span>
                    <span th:text="${transaction.currency}"></span>
                </span>
            </div>

            <div class="actions">
                <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn-delete"
                            onclick="return confirm('Удалить эту транзакцию?')">🗑️</button>
                </form>
            </div>
        </div>
    </div>

    <div style="margin-top: 30px; text-align: center;">
        <a href="/dashboard" style="color: #666; text-decoration: none;">← Назад к Дашборду</a>
    </div>
</div>

<script>
    // Простая группировка связанных транзакций
    document.addEventListener('DOMContentLoaded', function() {
        const linkedTransactions = document.querySelectorAll('.linked-transaction');

        linkedTransactions.forEach(transaction => {
            // Добавляем иконку для связанных транзакций
            const badge = transaction.querySelector('.linked-badge');
            if (badge) {
                badge.title = "Эта транзакция связана с другой (перевод между счетами)";
            }
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Детали операции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-wallet me-2"></i> Семейный бюджет
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/transactions">
                <i class="fas fa-arrow-left me-2"></i>Назад к списку
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">
                        <i class="fas fa-receipt me-2"></i>Детали операции
                    </h4>
                </div>
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-4">ID операции:</dt>
                        <dd class="col-sm-8" th:text="${transaction.id}"></dd>

                        <dt class="col-sm-4">Дата:</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(transaction.transactionDate, 'dd.MM.yyyy HH:mm')}"></dd>

                        <dt class="col-sm-4">Тип:</dt>
                        <dd class="col-sm-8">
                            <span th:switch="${transaction.transactionType}">
                                <span th:case="INCOME" class="badge bg-success">Доход</span>
                                <span th:case="EXPENSE" class="badge bg-danger">Расход</span>
                                <span th:case="TRANSFER" class="badge bg-info">Перевод</span>
                            </span>
                        </dd>

                        <dt class="col-sm-4">Категория:</dt>
                        <dd class="col-sm-8" th:text="${transaction.category.name}"></dd>

                        <dt class="col-sm-4">Сумма:</dt>
                        <dd class="col-sm-8">
                            <span th:switch="${transaction.transactionType}">
                                <span th:case="INCOME" class="text-success">
                                    +<span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span> ₽
                                </span>
                                <span th:case="EXPENSE" class="text-danger">
                                    -<span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span> ₽
                                </span>
                                <span th:case="TRANSFER" class="text-info">
                                    <span th:text="${#numbers.formatDecimal(transaction.amount, 1, 2)}"></span> ₽
                                </span>
                            </span>
                        </dd>

                        <dt class="col-sm-4">Комментарий:</dt>
                        <dd class="col-sm-8" th:text="${transaction.comment ?: 'Не указан'}"></dd>

                        <th:block th:if="${transaction.accounts and !transaction.accounts.empty}">
                            <dt class="col-sm-4">Связанные счета:</dt>
                            <dd class="col-sm-8">
                                <ul class="list-unstyled mb-0">
                                    <li th:each="account : ${transaction.accounts}">
                                        <span th:text="${account.currency + ' - ' + account.balance}"></span>
                                    </li>
                                </ul>
                            </dd>
                        </th:block>
                    </dl>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/transactions" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Назад к списку
                        </a>
                        <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}" method="post">
                            <button type="submit" class="btn btn-danger"
                                    onclick="return confirm('Удалить эту операцию?')">
                                <i class="fas fa-trash me-2"></i>Удалить
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

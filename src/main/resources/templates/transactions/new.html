<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать транзакцию</title>

    <!-- CSRF токены для AJAX запросов -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        /* Ваш оригинальный стиль */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        select, input[type="text"], input[type="number"], textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #45a049;
        }

        .btn-cancel {
            background-color: #f44336;
            margin-left: 10px;
        }

        .btn-cancel:hover {
            background-color: #d32f2f;
        }

        .error {
            color: #f44336;
            font-size: 14px;
            margin-top: 5px;
        }

        .success {
            color: #4CAF50;
            font-size: 14px;
            margin-top: 5px;
        }

        .hidden {
            display: none;
        }

        .category-container {
            display: flex;
            gap: 10px;
        }

        .category-container select {
            flex: 1;
        }

        .category-container button {
            width: 40px;
            background-color: #2196F3;
        }

        .category-container button:hover {
            background-color: #0b7dda;
        }

        /* Стиль для модального окна */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 5px;
            width: 90%;
            max-width: 400px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .form-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }

        .form-section h3 {
            margin-top: 0;
            color: #333;
        }

        /* Стиль для информации о владельце счета */
        .account-info {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
            font-style: italic;
        }

        /* Стиль для опций в выпадающих списках */
        option {
            padding: 5px;
        }

        /* Эмодзи для визуального выделения */
        .emoji {
            margin-right: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📝 Создать новую транзакцию</h1>

    <!-- Сообщения об ошибках/успехе -->
    <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <!-- Форма транзакции -->
    <form th:action="@{/transactions/new}" th:object="${transactionDto}" method="post" id="transactionForm">

        <!-- Тип операции -->
        <div class="form-group">
            <label for="transactionType">Тип операции *</label>
            <select id="transactionType" th:field="*{transactionType}" required
                    onchange="updateFormFields()">
                <option value="">-- Выберите тип операции --</option>
                <option th:each="type : ${transactionTypes}"
                        th:value="${type}"
                        th:text="${type == 'INCOME' ? '💰 Доход' :
                                     type == 'EXPENSE' ? '💸 Расход' :
                                     type == 'TRANSFER' ? '🔄 Перевод' : type}">
                </option>
            </select>
            <div th:if="${#fields.hasErrors('transactionType')}" class="error"
                 th:errors="*{transactionType}"></div>
        </div>

        <!-- Секция для доходов/расходов -->
        <div id="incomeExpenseFields" class="hidden">
            <div class="form-section">
                <h3>📋 Детали операции</h3>

                <!-- Счет -->
                <div class="form-group">
                    <label for="accountId">Счет *</label>
                    <select id="accountId" th:field="*{accountId}">
                        <option value="">-- Выберите счет --</option>
                        <option th:each="account : ${accounts}"
                                th:value="${account.id}"
                                th:data-owner="${account.user.userName}"
                                th:data-balance="${account.balance}"
                                th:data-currency="${account.currency}"
                                th:text="${'💳 Счет #' + account.id}">
                        </option>
                    </select>
                    <div class="account-info" id="accountOwnerInfo"></div>
                    <div class="account-info" id="accountBalanceInfo"></div>
                    <div th:if="${#fields.hasErrors('accountId')}" class="error"
                         th:errors="*{accountId}"></div>
                </div>

                <!-- Категория с подкатегориями -->
                <div class="form-group">
                    <label for="categorySelection">Категория *</label>
                    <div class="category-container">
                        <!-- Основная категория -->
                        <select id="mainCategoryId" onchange="loadSubcategories(this.value)">
                            <option value="">-- Основная категория --</option>
                            <!-- Заполняется через JavaScript -->
                        </select>

                        <!-- Подкатегория (это поле биндится к transactionDto.categoryId) -->
                        <select id="subcategoryId" th:field="*{categoryId}">
                            <option value="">-- Подкатегория --</option>
                        </select>

                        <!-- Кнопка добавления новой категории -->
                        <button type="button" id="addCategoryBtn" onclick="openAddCategoryModal()" title="Добавить категорию">
                            +
                        </button>
                    </div>
                    <div th:if="${#fields.hasErrors('categoryId')}" class="error"
                         th:errors="*{categoryId}"></div>
                    <div style="font-size: 12px; color: #666; margin-top: 5px;">
                        Сначала выберите основную категорию, затем подкатегорию
                    </div>
                </div>
            </div>
        </div>

        <!-- Секция для переводов -->
        <div id="transferFields" class="hidden">
            <div class="form-section">
                <h3>🔄 Перевод между счетами</h3>

                <!-- Счет списания -->
                <div class="form-group">
                    <label for="fromAccountId">Счет списания *</label>
                    <select id="fromAccountId" th:field="*{fromAccountId}" onchange="updateAccountInfo('from')">
                        <option value="">-- Выберите счет списания --</option>
                        <option th:each="account : ${accounts}"
                                th:value="${account.id}"
                                th:data-owner="${account.user.userName}"
                                th:data-balance="${account.balance}"
                                th:data-currency="${account.currency}"
                                th:text="${'💳 Счет #' + account.id}">
                        </option>
                    </select>
                    <div class="account-info" id="fromAccountOwnerInfo"></div>
                    <div class="account-info" id="fromAccountBalanceInfo"></div>
                    <div th:if="${#fields.hasErrors('fromAccountId')}" class="error"
                         th:errors="*{fromAccountId}"></div>
                </div>

                <!-- Счет зачисления -->
                <div class="form-group">
                    <label for="toAccountId">Счет зачисления *</label>
                    <select id="toAccountId" th:field="*{toAccountId}" onchange="updateAccountInfo('to')">
                        <option value="">-- Выберите счет зачисления --</option>
                        <option th:each="account : ${accounts}"
                                th:value="${account.id}"
                                th:data-owner="${account.user.userName}"
                                th:data-balance="${account.balance}"
                                th:data-currency="${account.currency}"
                                th:text="${'💳 Счет #' + account.id}">
                        </option>
                    </select>
                    <div class="account-info" id="toAccountOwnerInfo"></div>
                    <div class="account-info" id="toAccountBalanceInfo"></div>
                    <div th:if="${#fields.hasErrors('toAccountId')}" class="error"
                         th:errors="*{toAccountId}"></div>
                </div>
            </div>
        </div>

        <!-- Общие поля -->
        <div class="form-section">
            <h3>💰 Сумма и комментарий</h3>

            <!-- Сумма -->
            <div class="form-group">
                <label for="amount">Сумма *</label>
                <input type="number" id="amount" th:field="*{amount}"
                       step="0.01" min="0.01" required
                       placeholder="0.00">
                <div th:if="${#fields.hasErrors('amount')}" class="error"
                     th:errors="*{amount}"></div>
            </div>

            <!-- Комментарий -->
            <div class="form-group">
                <label for="comment">Комментарий (необязательно)</label>
                <textarea id="comment" th:field="*{comment}" rows="3"
                          placeholder="Добавьте описание операции..."></textarea>
                <div th:if="${#fields.hasErrors('comment')}" class="error"
                     th:errors="*{comment}"></div>
            </div>
        </div>

        <!-- Кнопки формы -->
        <div class="form-group">
            <button type="submit" class="btn">✅ Создать транзакцию</button>
            <a href="/dashboard" class="btn btn-cancel">❌ Отмена</a>
        </div>
    </form>
</div>

<!-- Модальное окно для добавления категории -->
<div id="categoryModal" class="modal">
    <div class="modal-content">
        <h3>📂 Добавить новую категорию</h3>
        <form id="categoryForm">
            <div class="form-group">
                <label for="newCategoryName">Название категории *</label>
                <input type="text" id="newCategoryName" required
                       placeholder="Например: Продукты, Развлечения">
            </div>

            <div class="form-group">
                <label for="newCategoryType">Тип категории *</label>
                <select id="newCategoryType" required>
                    <option value="">-- Выберите тип --</option>
                    <option value="INCOME">💰 Доход</option>
                    <option value="EXPENSE">💸 Расход</option>
                </select>
            </div>

            <div class="form-group">
                <label for="newCategoryParent">Родительская категория (необязательно)</label>
                <select id="newCategoryParent">
                    <option value="">-- Основная категория --</option>
                    <!-- Заполняется через JavaScript -->
                </select>
                <div style="font-size: 12px; color: #666; margin-top: 5px;">
                    Оставьте пустым для создания основной категории
                </div>
            </div>

            <div class="modal-buttons">
                <button type="button" class="btn" onclick="saveNewCategory()">✅ Сохранить</button>
                <button type="button" class="btn btn-cancel" onclick="closeModal()">❌ Отмена</button>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // ============ ИНИЦИАЛИЗАЦИЯ ============
    $(document).ready(function() {
        // Инициализация при загрузке страницы
        const type = $('#transactionType').val();
        if (type) {
            currentTransactionType = type;
            updateFormFields();
        }

        // Обновляем информацию о счетах при изменении выбора
        $('#accountId').change(function() {
            updateAccountInfo('main');
        });

        $('#fromAccountId').change(function() {
            updateAccountInfo('from');
        });

        $('#toAccountId').change(function() {
            updateAccountInfo('to');
        });

        // Инициализируем информацию о счетах, если уже выбраны
        updateAccountInfo('main');
        updateAccountInfo('from');
        updateAccountInfo('to');
    });

    // ============ ПЕРЕМЕННЫЕ ============
    let currentTransactionType = '';

    // ============ ОБНОВЛЕНИЕ ИНФОРМАЦИИ О СЧЕТАХ ============
    function updateAccountInfo(type) {
        let selectId, ownerInfoId, balanceInfoId;

        switch(type) {
            case 'main':
                selectId = '#accountId';
                ownerInfoId = '#accountOwnerInfo';
                balanceInfoId = '#accountBalanceInfo';
                break;
            case 'from':
                selectId = '#fromAccountId';
                ownerInfoId = '#fromAccountOwnerInfo';
                balanceInfoId = '#fromAccountBalanceInfo';
                break;
            case 'to':
                selectId = '#toAccountId';
                ownerInfoId = '#toAccountOwnerInfo';
                balanceInfoId = '#toAccountBalanceInfo';
                break;
        }

        const selectedOption = $(selectId + ' option:selected');
        const owner = selectedOption.data('owner');
        const balance = selectedOption.data('balance');
        const currency = selectedOption.data('currency');

        if (selectedOption.val()) {
            $(ownerInfoId).html('👤 Владелец: ' + (owner || 'Неизвестно'));
            $(balanceInfoId).html('💰 Баланс: ' + (balance || '0.00') + ' ' + (currency || 'RUB'));
        } else {
            $(ownerInfoId).html('');
            $(balanceInfoId).html('');
        }
    }

    // ============ ОБНОВЛЕНИЕ ФОРМЫ ============
    function updateFormFields() {
        const type = $('#transactionType').val();
        currentTransactionType = type;

        // Скрываем все секции
        $('#incomeExpenseFields').addClass('hidden');
        $('#transferFields').addClass('hidden');

        // Показываем нужную секцию
        if (type === 'INCOME' || type === 'EXPENSE') {
            $('#incomeExpenseFields').removeClass('hidden');
            loadCategories(type);
            updateAccountInfo('main');
        } else if (type === 'TRANSFER') {
            $('#transferFields').removeClass('hidden');
            updateAccountInfo('from');
            updateAccountInfo('to');
        }
    }

    // ============ ЗАГРУЗКА КАТЕГОРИЙ ============
    function loadCategories(transactionType) {
        // Используем правильный endpoint
        const url = '/transactions/api/categories/type/' + transactionType;

        $.ajax({
            url: url,
            type: 'GET',
            success: function(response) {
                if (response.success) {
                    const categories = response.data;

                    // Заполняем основную категорию
                    const $mainSelect = $('#mainCategoryId');
                    $mainSelect.empty();
                    $mainSelect.append('<option value="">-- Основная категория --</option>');

                    // Заполняем родительские категории в модальном окне
                    const $parentSelect = $('#newCategoryParent');
                    $parentSelect.empty();
                    $parentSelect.append('<option value="">-- Основная категория --</option>');

                    categories.forEach(function(category) {
                        $mainSelect.append(
                            $('<option></option>')
                                .val(category.id)
                                .text(category.name)
                        );

                        $parentSelect.append(
                            $('<option></option>')
                                .val(category.id)
                                .text(category.name)
                        );
                    });

                    // Очищаем подкатегории
                    $('#subcategoryId').empty().append('<option value="">-- Подкатегория --</option>');

                } else {
                    console.error('Ошибка загрузки категорий:', response.message);
                }
            },
            error: function(xhr, status, error) {
                console.error('AJAX ошибка при загрузке категорий:', error);
            }
        });
    }

    // ============ ЗАГРУЗКА ПОДКАТЕГОРИЙ ============
    function loadSubcategories(parentId) {
        if (!parentId) {
            $('#subcategoryId').empty().append('<option value="">-- Подкатегория --</option>');
            return;
        }

        $.ajax({
            url: '/transactions/api/categories/' + parentId + '/subcategories',
            type: 'GET',
            success: function(response) {
                if (response.success) {
                    const $subSelect = $('#subcategoryId');
                    $subSelect.empty();
                    $subSelect.append('<option value="">-- Подкатегория --</option>');

                    // Добавляем опцию для использования основной категории
                    $subSelect.append(
                        $('<option></option>')
                            .val(parentId)
                            .text('📁 Использовать основную категорию')
                    );

                    // Добавляем подкатегории
                    response.data.forEach(function(subcategory) {
                        $subSelect.append(
                            $('<option></option>')
                                .val(subcategory.id)
                                .text('   ├─ ' + subcategory.name)
                        );
                    });

                } else {
                    console.error('Ошибка загрузки подкатегорий:', response.message);
                }
            },
            error: function(xhr, status, error) {
                console.error('AJAX ошибка при загрузке подкатегорий:', error);
            }
        });
    }

    // ============ РАБОТА С МОДАЛЬНЫМ ОКНОМ ============
    function openAddCategoryModal() {
        if (!currentTransactionType ||
            (currentTransactionType !== 'INCOME' && currentTransactionType !== 'EXPENSE')) {
            alert('Сначала выберите тип операции (Доход или Расход)');
            return;
        }

        // Устанавливаем тип категории в модальном окне
        $('#newCategoryType').val(currentTransactionType);

        // Очищаем поле названия
        $('#newCategoryName').val('');

        // Показываем модальное окно
        $('#categoryModal').show();
    }

    function closeModal() {
        $('#categoryModal').hide();
    }

    // Закрытие модального окна при клике вне его
    $(window).click(function(event) {
        if ($(event.target).hasClass('modal')) {
            closeModal();
        }
    });

    // ============ СОХРАНЕНИЕ НОВОЙ КАТЕГОРИИ ============
    function saveNewCategory() {
        const categoryName = $('#newCategoryName').val().trim();
        const categoryType = $('#newCategoryType').val();
        const parentId = $('#newCategoryParent').val() || null;

        // Валидация
        if (!categoryName) {
            alert('Введите название категории');
            $('#newCategoryName').focus();
            return;
        }

        if (!categoryType) {
            alert('Выберите тип категории');
            return;
        }

        // Получаем CSRF токен из meta-тега
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        // Показываем индикатор загрузки
        $('#categoryForm button').prop('disabled', true).text('Сохранение...');

        // Отправляем запрос
        $.ajax({
            url: '/transactions/api/categories',
            type: 'POST',
            contentType: 'application/json',
            headers: {
                [csrfHeader]: csrfToken
            },
            data: JSON.stringify({
                name: categoryName,
                categoryType: categoryType,
                parentId: parentId
            }),
            success: function(response) {
                $('#categoryForm button').prop('disabled', false).text('✅ Сохранить');

                if (response.success) {
                    alert('✅ Категория "' + categoryName + '" успешно создана!');
                    closeModal();

                    // Обновляем список категорий
                    loadCategories(categoryType);

                    // Если создали подкатегорию, обновляем подкатегории
                    if (parentId) {
                        loadSubcategories(parentId);
                        // Автоматически выбираем новую подкатегорию
                        setTimeout(function() {
                            $('#subcategoryId').val(response.data.id);
                        }, 300);
                    }

                } else {
                    alert('❌ Ошибка: ' + response.message);
                }
            },
            error: function(xhr, status, error) {
                $('#categoryForm button').prop('disabled', false).text('✅ Сохранить');

                console.error('Ошибка создания категории:', xhr.responseText);

                if (xhr.status === 403) {
                    alert('❌ Ошибка безопасности. Попробуйте обновить страницу (F5).');
                } else if (xhr.status === 400) {
                    alert('❌ Ошибка: ' + (xhr.responseJSON ? xhr.responseJSON.message : 'Неверные данные'));
                } else {
                    alert('❌ Ошибка сервера. Попробуйте еще раз.');
                }
            }
        });
    }

    // ============ ВАЛИДАЦИЯ ФОРМЫ ============
    $('#transactionForm').submit(function(event) {
        const type = $('#transactionType').val();

        if (type === 'INCOME' || type === 'EXPENSE') {
            const categoryId = $('#subcategoryId').val();
            if (!categoryId) {
                alert('Пожалуйста, выберите категорию');
                event.preventDefault();
                return false;
            }

            const accountId = $('#accountId').val();
            if (!accountId) {
                alert('Пожалуйста, выберите счет');
                event.preventDefault();
                return false;
            }
        }

        if (type === 'TRANSFER') {
            const fromAccountId = $('#fromAccountId').val();
            const toAccountId = $('#toAccountId').val();

            if (!fromAccountId || !toAccountId) {
                alert('Пожалуйста, выберите оба счета для перевода');
                event.preventDefault();
                return false;
            }

            if (fromAccountId === toAccountId) {
                alert('Нельзя перевести средства на тот же счет');
                event.preventDefault();
                return false;
            }
        }

        return true;
    });

    // ============ КЛАВИША ESCAPE ============
    $(document).keydown(function(event) {
        if (event.key === 'Escape') {
            closeModal();
        }
    });

    // ============ ОБНОВЛЕНИЕ ОТОБРАЖЕНИЯ ТИПОВ ТРАНЗАКЦИЙ ============
    // Функция для обновления текста в выпадающем списке
    function updateTransactionTypeDisplay() {
        $('#transactionType option').each(function() {
            const value = $(this).val();
            let text = $(this).text();

            // Заменяем английские названия на русские
            switch(value) {
                case 'INCOME':
                    $(this).text('💰 Доход');
                    break;
                case 'EXPENSE':
                    $(this).text('💸 Расход');
                    break;
                case 'TRANSFER':
                    $(this).text('🔄 Перевод');
                    break;
                default:
                // Оставляем как есть
            }
        });
    }

    // Вызываем при загрузке страницы
    $(document).ready(function() {
        updateTransactionTypeDisplay();
    });
</script>
</body>
</html>

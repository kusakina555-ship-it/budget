<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить операцию</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        .transaction-type-btn {
            transition: all 0.3s ease;
        }
        .transaction-type-btn.active {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0,123,255,0.3);
        }
        .transfer-section {
            border: 1px dashed #6c757d;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-wallet me-2"></i> Семейный бюджет
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/dashboard">
                <i class="fas fa-arrow-left me-2"></i>Назад к дашборду
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">
                        <i class="fas fa-plus-circle me-2"></i>Добавить новую операцию
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Сообщения об ошибках/успехе -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Форма -->
                    <form th:action="@{/transactions/new}" th:object="${transactionDto}" method="post">

                        <!-- Выбор типа операции -->
                        <div class="mb-4">
                            <label class="form-label">Тип операции *</label>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-success transaction-type-btn flex-grow-1"
                                        onclick="selectTransactionType('INCOME')">
                                    <i class="fas fa-plus-circle me-2"></i>Доход
                                </button>
                                <button type="button" class="btn btn-danger transaction-type-btn flex-grow-1"
                                        onclick="selectTransactionType('EXPENSE')">
                                    <i class="fas fa-minus-circle me-2"></i>Расход
                                </button>
                                <button type="button" class="btn btn-info transaction-type-btn flex-grow-1"
                                        onclick="selectTransactionType('TRANSFER')">
                                    <i class="fas fa-exchange-alt me-2"></i>Перевод
                                </button>
                            </div>
                            <input type="hidden" th:field="*{transactionType}" id="transactionType">
                            <div class="text-danger" th:if="${#fields.hasErrors('transactionType')}"
                                 th:errors="*{transactionType}"></div>
                        </div>

                        <!-- Сумма -->
                        <div class="mb-3">
                            <label for="amount" class="form-label">Сумма *</label>
                            <div class="input-group">
                                <input type="number" th:field="*{amount}"
                                       class="form-control" id="amount"
                                       step="0.01" min="0.01" required>
                                <span class="input-group-text">₽</span>
                            </div>
                            <div class="text-danger" th:if="${#fields.hasErrors('amount')}"
                                 th:errors="*{amount}"></div>
                        </div>

                        <!-- Категория (скрыто для переводов) -->
                        <div class="mb-3" id="categorySection">
                            <label for="categoryId" class="form-label">Категория *</label>
                            <select th:field="*{categoryId}" class="form-select" id="categoryId">
                                <option value="">-- Выберите категорию --</option>
                                <!-- Категории доходов -->
                                <optgroup label="Доходы" id="incomeCategories">
                                    <option th:each="category : ${incomeCategories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}"></option>
                                </optgroup>
                                <!-- Категории расходов -->
                                <optgroup label="Расходы" id="expenseCategories">
                                    <option th:each="category : ${expenseCategories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}"></option>
                                </optgroup>
                            </select>
                            <div class="text-danger" th:if="${#fields.hasErrors('categoryId')}"
                                 th:errors="*{categoryId}"></div>
                        </div>

                        <!-- Счет (скрыто для переводов) -->
                        <div class="mb-3" id="accountSection">
                            <label for="accountId" class="form-label">Счет *</label>
                            <select th:field="*{accountId}" class="form-select" id="accountId">
                                <option value="">-- Выберите счет --</option>
                                <option th:each="account : ${accounts}"
                                        th:value="${account.id}"
                                        th:text="${account.currency + ' - ' + account.balance}"></option>
                            </select>
                        </div>

                        <!-- Перевод между счетами (скрыто по умолчанию) -->
                        <div id="transferSection" class="transfer-section" style="display: none;">
                            <h6 class="mb-3">Перевод между счетами</h6>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="fromAccountId" class="form-label">Со счета *</label>
                                    <select th:field="*{fromAccountId}" class="form-select" id="fromAccountId">
                                        <option value="">-- Выберите счет списания --</option>
                                        <option th:each="account : ${accounts}"
                                                th:value="${account.id}"
                                                th:text="${account.currency + ' - ' + account.balance}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="toAccountId" class="form-label">На счет *</label>
                                    <select th:field="*{toAccountId}" class="form-select" id="toAccountId">
                                        <option value="">-- Выберите счет зачисления --</option>
                                        <option th:each="account : ${accounts}"
                                                th:value="${account.id}"
                                                th:text="${account.currency + ' - ' + account.balance}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Комментарий -->
                        <div class="mb-4">
                            <label for="comment" class="form-label">Комментарий</label>
                            <textarea th:field="*{comment}" class="form-control" id="comment"
                                      rows="3" placeholder="Необязательное поле"></textarea>
                            <div class="form-text">Максимум 500 символов</div>
                            <div class="text-danger" th:if="${#fields.hasErrors('comment')}"
                                 th:errors="*{comment}"></div>
                        </div>

                        <!-- Кнопки -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="/dashboard" class="btn btn-secondary me-md-2">
                                <i class="fas fa-times me-2"></i>Отмена
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-check me-2"></i>Сохранить операцию
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Функция для выбора типа операции
    function selectTransactionType(type) {
        // Устанавливаем значение в скрытое поле
        document.getElementById('transactionType').value = type;

        // Обновляем стили кнопок
        document.querySelectorAll('.transaction-type-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');

        // Показываем/скрываем соответствующие поля
        const isTransfer = type === 'TRANSFER';
        const categorySection = document.getElementById('categorySection');
        const accountSection = document.getElementById('accountSection');
        const transferSection = document.getElementById('transferSection');

        if (isTransfer) {
            categorySection.style.display = 'none';
            accountSection.style.display = 'none';
            transferSection.style.display = 'block';

            // Устанавливаем категорию "Переводы" автоматически
            // В реальном приложении нужно найти ID категории "Переводы"
        } else {
            categorySection.style.display = 'block';
            accountSection.style.display = 'block';
            transferSection.style.display = 'none';

            // Показываем только соответствующие категории
            const incomeGroup = document.getElementById('incomeCategories');
            const expenseGroup = document.getElementById('expenseCategories');

            if (type === 'INCOME') {
                incomeGroup.style.display = 'block';
                expenseGroup.style.display = 'none';
            } else if (type === 'EXPENSE') {
                incomeGroup.style.display = 'none';
                expenseGroup.style.display = 'block';
            }
        }
    }

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', function() {
        // Устанавливаем тип по умолчанию (если не выбран)
        const currentType = document.getElementById('transactionType').value;
        if (currentType) {
            selectTransactionType(currentType);
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление категориями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Budget App</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/admin/dashboard">Админ-панель</a>
            <a class="nav-link" href="/">На главную</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Управление категориями</h1>

    <!-- Форма добавления новой категории -->
    <div class="card mb-4">
        <div class="card-header">Добавить новую категорию</div>
        <div class="card-body">
            <form th:action="@{/admin/categories}" method="post">
                <div class="row">
                    <div class="col-md-5">
                        <input type="text" class="form-control" name="name"
                               placeholder="Название категории" required>
                    </div>
                    <div class="col-md-5">
                        <select class="form-select" name="expenseType" required>
                            <option value="">Выберите тип</option>
                            <option th:each="type : ${expenseTypes}"
                                    th:value="${type}"
                                    th:text="${type == 'INCOME' ? 'Доход' : 'Расход'}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Добавить</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Список категорий -->
    <div class="card">
        <div class="card-header">Существующие категории</div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Тип</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}"></td>
                    <td th:text="${category.name}"></td>
                    <td>
                            <span th:if="${category.expenseType == 'INCOME'}"
                                  class="badge bg-success">Доход</span>
                        <span th:if="${category.expenseType == 'EXPENSE'}"
                              class="badge bg-danger">Расход</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/categories/{id}/delete(id=${category.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Удалить категорию?')">
                                Удалить
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

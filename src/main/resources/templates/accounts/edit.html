<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование счета</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }
        .account-info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .currency-flag {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        .currency-flag.rub {
            background-color: #28a745;
            color: white;
        }
        .currency-flag.usd {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-wallet me-2"></i> Семейный бюджет
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/admin/accounts">
                <i class="fas fa-arrow-left me-2"></i>Назад к управлению счетами
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">
                        <i class="fas fa-edit me-2"></i>Редактирование счета
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Информация о счете -->
                    <div class="account-info mb-4">
                        <h5>
                            <span class="currency-flag" th:classappend="${account.currency}">
                                <span th:text="${account.currency}"></span>
                            </span>
                            Счет #<span th:text="${account.id}"></span>
                        </h5>
                        <div class="row">
                            <div class="col-md-6">
                                <small class="text-muted">Текущий владелец:</small>
                                <div><i class="fas fa-user me-1"></i> <span th:text="${account.user.userName}"></span></div>
                            </div>
                            <div class="col-md-6">
                                <small class="text-muted">Дата создания:</small>
                                <div><i class="fas fa-calendar me-1"></i> <span th:text="${#temporals.format(account.createdAt, 'dd.MM.yyyy HH:mm')}"></span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Сообщения об ошибках/успехе -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Форма редактирования -->
                    <form th:action="@{/admin/accounts/{id}/edit(id=${account.id})}"
                          th:object="${editAccountDto}"
                          method="post">
                        <!-- CSRF токен -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <!-- Скрытое поле для ID счета -->
                        <input type="hidden" th:field="*{accountId}" />

                        <!-- Владелец счета -->
                        <div class="mb-3">
                            <label for="userId" class="form-label">Владелец счета *</label>
                            <select th:field="*{userId}" class="form-select" id="userId" required>
                                <option value="">-- Выберите пользователя --</option>
                                <option th:each="user : ${users}"
                                        th:value="${user.id}"
                                        th:selected="${user.id == editAccountDto.userId}"
                                        th:text="${user.userName + ' (' + user.email + ')'}"></option>
                            </select>
                            <div class="form-text">Выберите нового владельца счета</div>
                        </div>

                        <!-- Валюта -->
                        <div class="mb-3">
                            <label for="currency" class="form-label">Валюта *</label>
                            <select th:field="*{currency}" class="form-select" id="currency" required>
                                <option value="">-- Выберите валюту --</option>
                                <option value="RUB" th:selected="${editAccountDto.currency == 'RUB'}">RUB (Российский рубль)</option>
                                <option value="USD" th:selected="${editAccountDto.currency == 'USD'}">USD (Доллар США)</option>
                            </select>
                        </div>

                        <!-- Баланс -->
                        <div class="mb-4">
                            <label for="balance" class="form-label">Баланс *</label>
                            <div class="input-group">
                                <input type="number" th:field="*{balance}"
                                       class="form-control" id="balance"
                                       step="0.01" min="0" required>
                                <span class="input-group-text" id="currencySymbol">
                                    <span th:text="${editAccountDto.currency == 'RUB' ? '₽' : '$'}"></span>
                                </span>
                            </div>
                            <div class="form-text">Минимальный баланс: 0</div>
                            <div class="text-danger" th:if="${#fields.hasErrors('balance')}"
                                 th:errors="*{balance}"></div>
                        </div>

                        <!-- Кнопки -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="/admin/accounts" class="btn btn-secondary me-md-2">
                                <i class="fas fa-times me-2"></i>Отмена
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Сохранить изменения
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Предупреждение об осторожности -->
            <div class="alert alert-warning mt-4">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <strong>Внимание!</strong> Изменение владельца счета или баланса может повлиять на финансовую отчетность.
                Убедитесь, что изменения корректны.
            </div>
        </div>
    </div>
</div>

<script>
    // Обновление символа валюты при выборе
    document.addEventListener('DOMContentLoaded', function() {
        const currencySelect = document.getElementById('currency');
        const currencySymbol = document.getElementById('currencySymbol');

        if (currencySelect && currencySymbol) {
            currencySelect.addEventListener('change', function() {
                const currency = this.value;
                if (currency === 'RUB') {
                    currencySymbol.textContent = '₽';
                } else if (currency === 'USD') {
                    currencySymbol.textContent = '$';
                }
            });
        }

        // Предупреждение при изменении баланса
        const balanceInput = document.getElementById('balance');
        if (balanceInput) {
            balanceInput.addEventListener('change', function() {
                const newBalance = parseFloat(this.value);
                if (newBalance < 0) {
                    alert('Баланс не может быть отрицательным!');
                    this.value = Math.abs(newBalance);
                }
            });
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

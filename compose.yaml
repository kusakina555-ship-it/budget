name: budget-app
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budget-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Для Windows/Mac
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/budget_app
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=765338955Lulu
      # настройки Hibernate для работы с существующей БД
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_PROPERTIES_HIBERNATE_TEMP_USE_JDBC_METADATA_DEFAULTS=false
    # Убрал healthcheck - он может мешать при старте
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
